apiVersion: apps/v1
kind: Deployment
metadata:
  name: tylerpedersen-api
  namespace: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tylerpedersen-api
  template:
    metadata:
      labels:
        app: tylerpedersen-api
    spec:
      containers:
        - name: api
          image: ${API_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          # Runtime env for the api. Variable names match .env.example; values
          # come from GitHub Secrets via the deploy workflow. optional: true so a
          # missing Secret degrades the app instead of wedging the rollout.
          envFrom:
            - secretRef:
                name: tylerpedersen-api-env
                optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      imagePullSecrets:
        - name: registry-tylerpedersen
