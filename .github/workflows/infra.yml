name: infra

# Terraform runs on GitHub runners, never from a laptop.
# Plan automatically on PRs touching infra/**; apply only via manual dispatch.

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      directory:
        description: "Which state to act on"
        required: true
        type: choice
        options:
          - platform
          - addons
      action:
        description: "plan or apply"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

concurrency:
  group: infra-${{ github.event.inputs.directory || 'pr' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # DigitalOcean provider token.
  TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
  # Spaces keys for the S3-compatible state backend.
  AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        directory: [platform, addons]

    defaults:
      run:
        working-directory: infra/${{ matrix.directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -lock-timeout=5m

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -lock-timeout=5m -no-color

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # Requires a reviewer on the "infra" environment before Terraform touches
    # anything. Configure it in repo Settings > Environments.
    environment: infra

    permissions:
      contents: read

    defaults:
      run:
        working-directory: infra/${{ github.event.inputs.directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Init
        run: terraform init -lock-timeout=5m

      - name: Plan
        run: terraform plan -lock-timeout=5m -no-color -out=tfplan

      - name: Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -lock-timeout=5m -no-color -auto-approve tfplan
