name: deploy

on:
  pull_request:
    branches:
      - main
    types:
      - closed

# Infrastructure (registry, cluster, ingress-nginx, cert-manager, namespace,
# pull secret) is owned by Terraform in infra/. This workflow only builds the
# image and rolls the app forward.

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-image:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      REGISTRY: registry.digitalocean.com
      DOCR_REGISTRY_NAME: tylerpedersen
      IMAGE_NAME: tylerpedersen

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.DOCR_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.event.pull_request.merge_commit_sha }}
            ${{ env.REGISTRY }}/${{ env.DOCR_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:latest

  deploy-k8s:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: build-image

    env:
      REGISTRY: registry.digitalocean.com
      DOCR_REGISTRY_NAME: tylerpedersen
      IMAGE_NAME: tylerpedersen
      CLUSTER_NAME: tylerpedersen
      K8S_NAMESPACE: web
      DEPLOYMENT_NAME: tylerpedersen-web

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: doctl kubernetes cluster kubeconfig save "${CLUSTER_NAME}"

      - name: Apply Kubernetes manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.DOCR_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.event.pull_request.merge_commit_sha }}
        run: |
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/cluster-issuer.yaml
          kubectl apply -f k8s/ingress.yaml

          # Deployment carries the image tag directly, so apply is the rollout.
          envsubst '${IMAGE}' < k8s/deployment.yaml | kubectl apply -f -

      - name: Wait for rollout
        run: |
          if ! kubectl -n "${K8S_NAMESPACE}" rollout status deployment/"${DEPLOYMENT_NAME}" --timeout=300s; then
            echo "Rollout failed. Collecting diagnostics..."
            kubectl -n "${K8S_NAMESPACE}" get deploy,rs,pods -o wide || true
            kubectl -n "${K8S_NAMESPACE}" describe deployment "${DEPLOYMENT_NAME}" || true
            kubectl -n "${K8S_NAMESPACE}" get events --sort-by=.lastTimestamp | tail -n 100 || true
            kubectl -n "${K8S_NAMESPACE}" describe pods -l app="${DEPLOYMENT_NAME}" || true
            exit 1
          fi
