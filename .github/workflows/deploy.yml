name: deploy

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  # Manual redeploy, e.g. after a cluster rebuild when no PR is pending.
  workflow_dispatch:

# Infrastructure (registry, cluster, ingress-nginx, cert-manager, namespace,
# pull secret) is owned by Terraform in infra/. This workflow only builds the
# image and rolls the app forward.

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-image:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      REGISTRY: registry.digitalocean.com
      DOCR_REGISTRY_NAME: tylerpedersen
      IMAGE_NAME: tylerpedersen
      API_IMAGE_NAME: tylerpedersen-api

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.DOCR_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.event.pull_request.merge_commit_sha || github.sha }}
            ${{ env.REGISTRY }}/${{ env.DOCR_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.DOCR_REGISTRY_NAME }}/${{ env.API_IMAGE_NAME }}:${{ github.event.pull_request.merge_commit_sha || github.sha }}
            ${{ env.REGISTRY }}/${{ env.DOCR_REGISTRY_NAME }}/${{ env.API_IMAGE_NAME }}:latest

  deploy-k8s:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: build-image

    env:
      REGISTRY: registry.digitalocean.com
      DOCR_REGISTRY_NAME: tylerpedersen
      IMAGE_NAME: tylerpedersen
      API_IMAGE_NAME: tylerpedersen-api
      CLUSTER_NAME: tylerpedersen
      K8S_NAMESPACE: web
      DEPLOYMENT_NAME: tylerpedersen-web
      API_DEPLOYMENT_NAME: tylerpedersen-api

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: doctl kubernetes cluster kubeconfig save "${CLUSTER_NAME}"

      - name: Apply Kubernetes manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.DOCR_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.event.pull_request.merge_commit_sha || github.sha }}
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.DOCR_REGISTRY_NAME }}/${{ env.API_IMAGE_NAME }}:${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/api-service.yaml
          kubectl apply -f k8s/cluster-issuer.yaml
          kubectl apply -f k8s/ingress.yaml

          # Deployments carry the image tag directly, so apply is the rollout.
          envsubst '${IMAGE}' < k8s/deployment.yaml | kubectl apply -f -
          envsubst '${API_IMAGE}' < k8s/api-deployment.yaml | kubectl apply -f -

      - name: Wait for rollout
        run: |
          rollout() {
            local name="$1"
            if kubectl -n "${K8S_NAMESPACE}" rollout status deployment/"${name}" --timeout=300s; then
              return 0
            fi

            echo "Rollout failed for ${name}. Collecting diagnostics..."
            kubectl -n "${K8S_NAMESPACE}" get deploy,rs,pods -o wide || true
            kubectl -n "${K8S_NAMESPACE}" describe deployment "${name}" || true
            kubectl -n "${K8S_NAMESPACE}" get events --sort-by=.lastTimestamp | tail -n 100 || true
            kubectl -n "${K8S_NAMESPACE}" describe pods -l app="${name}" || true
            return 1
          }

          rollout "${DEPLOYMENT_NAME}"
          rollout "${API_DEPLOYMENT_NAME}"
